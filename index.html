<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DATA EN VRAC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 2rem 16px;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .boutons {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
    }
    button {
      min-width: 200px;
      padding: 1rem 2rem;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 999px;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button:hover, button:focus-visible {
      background: #fff;
      color: #000;
      outline: none;
    }
  </style>
</head>
<body>
  <h1>DATA EN VRAC</h1>
  <div class="boutons">
    <button type="button">Écologie</button>
    <button type="button">Économie</button>
  </div>
</body>
</html>
